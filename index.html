<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Payment Successful | policybazaar.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pb-blue: #2e74e9;
    --pb-blue-dark: #1f5bc4;
    --pb-red: #e8332c;
    --ink: #171b26;
    --ink-soft: #5b6273;
    --bg: #eef2f9;
    --card-bg: #ffffff;
    --card-border: #e3e8f2;
    --divider: #edf0f6;
    --success-bg: #e8f8ee;
    --success-text: #148a44;
    --success-ring: #1fb15c;
    --header-bg: #ffffff;
    --shadow: 0 20px 44px -22px rgba(22, 40, 90, 0.28);
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #0b0e16;
      --card-bg: #12172316;
      --card-bg: #131826;
      --card-border: #232a3b;
      --divider: #1d2333;
      --ink: #eef1f8;
      --ink-soft: #9aa2b6;
      --header-bg: #0f1420;
      --success-bg: #10251a;
      --success-text: #4ade80;
      --success-ring: #22c55e;
      --shadow: 0 20px 44px -22px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b0e16;
    --card-bg: #131826;
    --card-border: #232a3b;
    --divider: #1d2333;
    --ink: #eef1f8;
    --ink-soft: #9aa2b6;
    --header-bg: #0f1420;
    --success-bg: #10251a;
    --success-text: #4ade80;
    --success-ring: #22c55e;
    --shadow: 0 20px 44px -22px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    width: 100%;
  }

  body {
    background: var(--bg);
    font-family: var(--font);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header / banner ---------- */
  header {
    background: #ffffff;
    border-bottom: 1px solid var(--card-border);
  }

  .header-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(12px, 2vw, 18px) clamp(16px, 4vw, 32px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(10px, 3vw, 24px);
    flex-wrap: wrap;
  }

  .logo-block {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }

  .logo-img {
    height: clamp(28px, 5vw, 42px);
    width: auto;
    max-width: 100%;
    display: block;
  }



  .trust-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(11.5px, 2.4vw, 13px);
    color: #101010;
    white-space: nowrap;
  }

  .trust-badge svg { flex-shrink: 0; }
  .trust-badge strong { color: #101010; font-weight: 700; }

  /* ---------- Main content ---------- */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 6vw, 56px) clamp(16px, 4vw, 20px);
    width: 100%;
  }

  .receipt-card {
    width: 100%;
    max-width: min(440px, 92vw);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: clamp(26px, 5vw, 36px) clamp(20px, 5vw, 28px) clamp(22px, 4vw, 28px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .status-ring {
    width: clamp(56px, 12vw, 68px);
    height: clamp(56px, 12vw, 68px);
    border-radius: 50%;
    background: var(--success-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    flex-shrink: 0;
  }

  .status-ring svg {
    width: 55%;
    height: 55%;
  }

  .status-ring circle,
  .status-ring path {
    stroke: var(--success-ring);
  }

  h1 {
    font-size: clamp(19px, 4.5vw, 22px);
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtext {
    font-size: clamp(13px, 3vw, 14px);
    color: var(--ink-soft);
    margin: 0 0 26px;
    line-height: 1.5;
  }

  .details {
    width: 100%;
    border-top: 1px solid var(--divider);
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--divider);
    text-align: left;
  }

  .row .label {
    font-size: clamp(12.5px, 2.8vw, 13px);
    color: var(--ink-soft);
    flex-shrink: 0;
  }

  .row .value {
    font-size: clamp(13px, 2.9vw, 13.5px);
    font-weight: 700;
    color: var(--ink);
    text-align: right;
    word-break: break-word;
    max-width: 60%;
  }


  .actions {
    width: 100%;
    margin-top: 24px;
  }

  .btn-primary {
    width: 100%;
    min-height: 48px;
    background: var(--pb-blue);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: clamp(14px, 3vw, 15px);
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-primary:hover { background: var(--pb-blue-dark); }
  .btn-primary:focus-visible { outline: 2px solid var(--pb-blue-dark); outline-offset: 2px; }

  footer {
    text-align: center;
    padding: 0 20px 32px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  footer .cert {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-weight: 600;
  }

  @media (max-width: 380px) {
    .receipt-card { border-radius: 14px; }
    .trust-badge span { display: none; }
    .trust-badge { gap: 0; }
  }

  @media (min-width: 768px) {
    .receipt-card { max-width: 460px; }
    h1 { font-size: 23px; }
  }

  @media (min-width: 1024px) {
    main { padding-top: 64px; padding-bottom: 72px; }
  }
</style>
</head>
